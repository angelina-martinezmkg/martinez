<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Growth and Development</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(ellipse at 20% 10%,#1f3f8f55,transparent 50%),radial-gradient(ellipse at 90% 90%,#c9a45c33,transparent 45%),#070d1c;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center}
    main{max-width:640px;display:grid;justify-items:center;gap:1.2rem}
    .ico{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#1b2f60,#0b1730);box-shadow:inset 0 0 0 1px rgba(230,200,138,.5);display:grid;place-items:center}
    .ico svg{width:40px;height:40px}
    h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:300;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.05;letter-spacing:-.03em}
    h1 em{color:#e6c88a}
    p{margin:0;color:#9aa6c4;font-size:1.05rem;line-height:1.7}
    .row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
    a.btn{display:inline-flex;align-items:center;min-height:3.3rem;padding:0 1.6rem;border-radius:999px;background:linear-gradient(135deg,#e6c88a,#c9a45c);color:#070d1c;font-weight:600;text-decoration:none}
    a:focus-visible{outline:2px solid #e6c88a;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <span class="ico" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 25L12 17l5 4 10-12" fill="none" stroke="#e6c88a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 9h6v6" fill="none" stroke="#e6c88a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <h1>This page <em>could not be found.</em></h1>
    <p>The page you're looking for doesn't exist or may have moved.</p>
    <div class="row">
      <a class="btn" href="/">Back to home</a>
    </div>
  </main>
</body>
</html>
